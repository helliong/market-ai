<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/logo.webp" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>MarketAI for sellers</title>
    <style>
      :root {
        --initial-bg: #f4f6fb;
        --initial-card: #ffffff;
        --initial-text: #111827;
        --initial-muted: #6b7280;
        --initial-accent: #facc15;
        --initial-skeleton: #ece8dc;
        --initial-skeleton-highlight: rgba(255, 255, 255, 0.72);
      }

      html,
      body,
      #root {
        min-height: 100%;
      }

      body {
        margin: 0;
        background:
          linear-gradient(135deg, rgba(250, 204, 21, 0.18), transparent 34%),
          var(--initial-bg);
      }

      .initial-loader {
        position: fixed;
        inset: 0;
        z-index: 9999;
        background:
          linear-gradient(135deg, rgba(250, 204, 21, 0.18), transparent 34%),
          var(--initial-bg);
        color: var(--initial-text);
        font-family:
          Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont,
          "Segoe UI", sans-serif;
        transition:
          opacity 0.22s ease,
          visibility 0.22s ease;
      }

      .initial-loader.is-hidden {
        visibility: hidden;
        opacity: 0;
      }

      .initial-loader-shell {
        display: grid;
        gap: 52px;
        width: min(1440px, calc(100% - 56px));
        margin: 0 auto;
        padding: 28px 0 48px;
      }

      html[data-initial-page="login"] .initial-loader-shell--welcome,
      html[data-initial-page="register"] .initial-loader-shell--welcome,
      html[data-initial-page="admin"] .initial-loader-shell--welcome {
        display: none;
      }

      html:not([data-initial-page="login"]) .initial-loader-shell--login,
      html:not([data-initial-page="register"]) .initial-loader-shell--register,
      html:not([data-initial-page="admin"]) .initial-loader-shell--admin {
        display: none;
      }

      .initial-loader-header {
        display: flex;
        align-items: center;
        justify-content: space-between;
        gap: 24px;
      }

      .initial-loader-logo {
        display: flex;
        align-items: center;
        gap: 8px;
        font-size: 24px;
        font-weight: 900;
      }

      .initial-loader-logo span {
        color: var(--initial-accent);
      }

      .initial-loader-badge {
        width: fit-content;
        border: 1px solid var(--initial-accent);
        border-radius: 999px;
        color: #b45309;
        padding: 4px 8px;
        font-size: 11px;
        font-weight: 700;
        line-height: 1;
      }

      .initial-loader-nav {
        display: flex;
        gap: 12px;
      }

      .initial-loader-pill {
        width: 92px;
        height: 42px;
        border-radius: 14px;
      }

      .initial-loader-pill:last-child {
        width: 128px;
      }

      .initial-loader-hero {
        display: grid;
        grid-template-columns: minmax(0, 1fr) 460px;
        gap: 52px;
        align-items: center;
        min-height: 430px;
      }

      .initial-loader-auth-shell {
        min-height: calc(100vh - 56px);
        grid-template-rows: auto 1fr;
      }

      .initial-loader-auth-body {
        display: grid;
        grid-template-columns: minmax(0, 1fr) 460px;
        gap: 40px;
        align-items: center;
      }

      .initial-loader-copy,
      .initial-loader-panel,
      .initial-loader-cards {
        display: grid;
        gap: 16px;
      }

      .initial-loader-panel {
        border: 1px solid rgba(17, 24, 39, 0.08);
        border-radius: 32px;
        background: var(--initial-card);
        padding: 28px;
        box-shadow: 0 18px 50px rgba(15, 23, 42, 0.1);
      }

      .initial-loader-card-grid {
        display: grid;
        grid-template-columns: repeat(3, minmax(0, 1fr));
        gap: 16px;
      }

      .initial-loader-card-grid > div {
        min-height: 150px;
        border: 1px solid rgba(17, 24, 39, 0.08);
        border-radius: 22px;
        background: var(--initial-card);
        padding: 22px;
      }

      .skeleton {
        position: relative;
        overflow: hidden;
        background: var(--initial-skeleton);
      }

      .skeleton::after {
        content: "";
        position: absolute;
        inset: 0;
        background: linear-gradient(
          90deg,
          transparent,
          var(--initial-skeleton-highlight),
          transparent
        );
        animation: skeletonShimmer 1.25s ease-in-out infinite;
        transform: translateX(-100%);
      }

      .skeleton-line {
        height: 14px;
        border-radius: 999px;
      }

      .skeleton-title {
        width: min(620px, 100%);
        height: 64px;
        border-radius: 18px;
      }

      .skeleton-title + .skeleton-title {
        width: min(520px, 90%);
      }

      .skeleton-text {
        width: min(580px, 100%);
      }

      .skeleton-text.short {
        width: min(420px, 72%);
      }

      .skeleton-button-row {
        display: flex;
        gap: 12px;
        margin-top: 12px;
      }

      .skeleton-button {
        width: 156px;
        height: 50px;
        border-radius: 16px;
      }

      .skeleton-icon {
        width: 48px;
        height: 48px;
        border-radius: 16px;
      }

      .skeleton-metric-grid {
        display: grid;
        grid-template-columns: repeat(3, minmax(0, 1fr));
        gap: 10px;
      }

      .skeleton-metric {
        height: 78px;
        border-radius: 18px;
      }

      .skeleton-status {
        height: 44px;
        border-radius: 14px;
      }

      .skeleton-form {
        display: grid;
        gap: 18px;
        border: 1px solid rgba(17, 24, 39, 0.08);
        border-radius: 32px;
        background: var(--initial-card);
        padding: 28px;
        box-shadow: 0 18px 50px rgba(15, 23, 42, 0.1);
      }

      .skeleton-field {
        display: grid;
        gap: 8px;
      }

      .skeleton-label {
        width: 92px;
        height: 13px;
        border-radius: 999px;
      }

      .skeleton-input {
        height: 48px;
        border-radius: 16px;
      }

      .skeleton-form-button {
        height: 48px;
        border-radius: 16px;
      }

      .skeleton-agreement {
        height: 58px;
        border-radius: 16px;
      }

      .initial-loader-admin {
        display: grid;
        grid-template-columns: 88px minmax(0, 1fr);
        width: 100%;
        min-height: 100vh;
        padding: 0;
      }

      .initial-loader-sidebar {
        display: grid;
        align-content: start;
        gap: 24px;
        background: #111827;
        padding: 24px;
      }

      .initial-loader-sidebar-logo {
        width: 40px;
        height: 40px;
        border-radius: 12px;
        background: var(--initial-accent);
      }

      .initial-loader-sidebar-nav {
        display: grid;
        gap: 12px;
        margin-top: 16px;
      }

      .initial-loader-sidebar-item {
        width: 40px;
        height: 40px;
        border-radius: 12px;
        background: rgba(255, 255, 255, 0.12);
      }

      .initial-loader-admin-content {
        display: grid;
        align-content: start;
        gap: 28px;
        padding: 28px;
      }

      .initial-loader-topbar {
        display: flex;
        align-items: center;
        justify-content: space-between;
        gap: 16px;
      }

      .initial-loader-admin-title {
        display: grid;
        gap: 10px;
      }

      .initial-loader-admin-profile {
        width: 142px;
        height: 42px;
        border-radius: 12px;
      }

      .initial-loader-admin-cards {
        display: grid;
        grid-template-columns: repeat(4, minmax(0, 1fr));
        gap: 18px;
      }

      .initial-loader-admin-card {
        display: grid;
        gap: 14px;
        min-height: 118px;
        border: 1px solid rgba(17, 24, 39, 0.08);
        border-radius: 18px;
        background: var(--initial-card);
        padding: 22px;
        box-shadow: 0 10px 30px rgba(15, 23, 42, 0.08);
      }

      .initial-loader-admin-panel {
        display: grid;
        gap: 18px;
        border: 1px solid rgba(17, 24, 39, 0.08);
        border-radius: 18px;
        background: var(--initial-card);
        padding: 22px;
        box-shadow: 0 10px 30px rgba(15, 23, 42, 0.08);
      }

      .initial-loader-admin-panel-header {
        display: flex;
        align-items: center;
        justify-content: space-between;
        gap: 18px;
      }

      .initial-loader-table {
        display: grid;
        gap: 12px;
      }

      .initial-loader-table-row {
        display: grid;
        grid-template-columns: 1.3fr 0.8fr 0.8fr 0.6fr;
        gap: 14px;
        align-items: center;
      }

      .initial-loader-table-cell {
        height: 18px;
        border-radius: 999px;
      }

      @keyframes skeletonShimmer {
        to {
          transform: translateX(100%);
        }
      }

      @media (max-width: 900px) {
        .initial-loader-shell {
          width: min(100% - 44px, 1440px);
          gap: 40px;
          padding-top: 22px;
        }

        .initial-loader-header {
          align-items: flex-start;
          flex-direction: column;
        }

        .initial-loader-nav {
          width: 100%;
        }

        .initial-loader-pill {
          flex: 1;
        }

        .initial-loader-hero,
        .initial-loader-auth-body,
        .initial-loader-card-grid {
          grid-template-columns: 1fr;
        }

        .initial-loader-admin {
          grid-template-columns: 1fr;
        }

        .initial-loader-sidebar {
          grid-template-columns: 40px repeat(4, 40px);
          align-items: center;
          padding: 19px 22px;
        }

        .initial-loader-sidebar-nav {
          grid-template-columns: repeat(4, 40px);
          margin-top: 0;
        }

        .initial-loader-admin-cards {
          grid-template-columns: 1fr;
        }

        .initial-loader-topbar,
        .initial-loader-admin-panel-header {
          align-items: flex-start;
          flex-direction: column;
        }

        .skeleton-title {
          height: 44px;
        }
      }
    </style>
    <script>
      const initialPath = window.location.pathname.replace(/\/$/, "");
      if (initialPath === "/login") {
        document.documentElement.dataset.initialPage = "login";
      }

      if (initialPath === "/register") {
        document.documentElement.dataset.initialPage = "register";
      }

      if (
        ["/dashboard", "/products", "/orders", "/users"].includes(initialPath)
      ) {
        document.documentElement.dataset.initialPage = "admin";
      }
    </script>
  </head>
