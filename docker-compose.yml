services:
  caddy:
    image: caddy:2-alpine
    container_name: market-ai-caddy
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile
      - caddy_data:/data
      - caddy_config:/config
    depends_on:
      - client
      - admin
      - moderation
      - api-gateway
    networks:
      - market-ai-network


  postgres:
    image: postgres:16
    container_name: market-ai-postgres
    restart: always
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    ports:
      - "5433:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    networks:
      - market-ai-network

  redis:
    image: redis:7
    container_name: market-ai-redis
    restart: always
    ports:
      - "6379:6379"
    networks:
      - market-ai-network

  minio:
    image: minio/minio:RELEASE.2025-04-22T22-12-26Z
    container_name: market-ai-minio
    restart: always
    command: server /data --console-address ":9001"
    environment:
      - MINIO_ROOT_USER=${S3_ACCESS_KEY:-minioadmin}
      - MINIO_ROOT_PASSWORD=${S3_SECRET_KEY:-minioadmin}
    ports:
      - "9000:9000"
      - "9001:9001"
    volumes:
      - minio_data:/data
    networks:
      - market-ai-network

  api-gateway:
    build: ./services/api-gateway
    container_name: market-ai-api-gateway
    restart: always
    environment:
      - API_GATEWAY_PORT=4000
      - JWT_ACCESS_SECRET=${JWT_ACCESS_SECRET}
      - REDIS_URL=redis://redis:6379
      - CLIENT_URL=${CLIENT_URL}
      - ADMIN_CLIENT_URL=${ADMIN_CLIENT_URL}
      - MODERATION_CLIENT_URL=${MODERATION_CLIENT_URL}
      - AUTH_SERVICE_URL=http://auth-service:4001
      - CART_SERVICE_URL=http://cart-service:4002
      - CATALOG_SERVICE_URL=http://catalog-service:4003
      - ORDER_SERVICE_URL=http://order-service:4004
      - STORAGE_SERVICE_URL=http://storage-service:4005
      - AI_AGENT_SERVICE_URL=http://ai-agent-service:4006
      - NODE_ENV=production
      - RATE_LIMIT_PUBLIC_LIMIT=${RATE_LIMIT_PUBLIC_LIMIT}
      - RATE_LIMIT_PUBLIC_TTL_MS=${RATE_LIMIT_PUBLIC_TTL_MS}
      - RATE_LIMIT_AUTH_LIMIT=${RATE_LIMIT_AUTH_LIMIT}
      - RATE_LIMIT_AUTH_TTL_MS=${RATE_LIMIT_AUTH_TTL_MS}
      - RATE_LIMIT_AUTH_BLOCK_MS=${RATE_LIMIT_AUTH_BLOCK_MS}
      - RATE_LIMIT_DEFAULT_LIMIT=${RATE_LIMIT_DEFAULT_LIMIT}
      - RATE_LIMIT_DEFAULT_TTL_MS=${RATE_LIMIT_DEFAULT_TTL_MS}
      - RATE_LIMIT_AI_LIMIT=${RATE_LIMIT_AI_LIMIT}
      - RATE_LIMIT_AI_TTL_MS=${RATE_LIMIT_AI_TTL_MS}
    depends_on:
      - redis
      - auth-service
      - cart-service
      - catalog-service
      - order-service
      - storage-service
      - ai-agent-service
    networks:
      - market-ai-network

  auth-service:
    build: ./services/auth-service
    container_name: market-ai-auth
    restart: always
    ports:
      - "4001:4001"
    environment:
      - DATABASE_URL=postgresql://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB}?schema=public
      - JWT_ACCESS_SECRET=${JWT_ACCESS_SECRET}
      - JWT_REFRESH_SECRET=${JWT_REFRESH_SECRET}
      - EMAIL_USER=${EMAIL_USER}
      - EMAIL_PASS=${EMAIL_PASS}
      - PORT=4001
      - NODE_ENV=production
      - CLIENT_URL=${CLIENT_URL}
      - ADMIN_CLIENT_URL=${ADMIN_CLIENT_URL}
      - MODERATION_CLIENT_URL=${MODERATION_CLIENT_URL}
      - REDIS_URL=${REDIS_URL:-redis://redis:6379}
      - MODERATION_ADMIN_EMAIL=${MODERATION_ADMIN_EMAIL}
      - MODERATION_ADMIN_PASSWORD=${MODERATION_ADMIN_PASSWORD}
      - MODERATION_ADMIN_KEY=${MODERATION_ADMIN_KEY}
    depends_on:
      - postgres
      - redis
    networks:
      - market-ai-network

  cart-service:
    build: ./services/cart-service
    container_name: market-ai-cart
    restart: always
    ports:
      - "4002:4002"
    environment:
      - DATABASE_URL=postgresql://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB}?schema=public
      - JWT_ACCESS_SECRET=${JWT_ACCESS_SECRET}
      - CLIENT_URL=${CLIENT_URL}
      - CART_SERVICE_PORT=4002
      - NODE_ENV=production
    depends_on:
      - postgres
      - auth-service
    networks:
      - market-ai-network

  catalog-service:
    build: ./services/catalog-service
    container_name: market-ai-catalog
    restart: always
    ports:
      - "4003:4003"
    environment:
      - DATABASE_URL=postgresql://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB}?schema=public
      - JWT_ACCESS_SECRET=${JWT_ACCESS_SECRET}
      - AUTH_SERVICE_URL=http://auth-service:4001
      - CATALOG_SERVICE_PORT=4003
      - ADMIN_CLIENT_URL=${ADMIN_CLIENT_URL}
      - CLIENT_URL=${CLIENT_URL}
      - NODE_ENV=production
    depends_on:
      - postgres
      - auth-service
    networks:
      - market-ai-network

  order-service:
    build: ./services/order-service
    container_name: market-ai-order
    restart: always
    ports:
      - "4004:4004"
    environment:
      - DATABASE_URL=postgresql://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB}?schema=public
      - JWT_ACCESS_SECRET=${JWT_ACCESS_SECRET}
      - CLIENT_URL=${CLIENT_URL}
      - ADMIN_CLIENT_URL=${ADMIN_CLIENT_URL}
      - MODERATION_CLIENT_URL=${MODERATION_CLIENT_URL}
      - ORDER_SERVICE_PORT=4004
      - CATALOG_SERVICE_URL=http://catalog-service:4003
      - YOOKASSA_SHOP_ID=${YOOKASSA_SHOP_ID}
      - YOOKASSA_API_KEY=${YOOKASSA_API_KEY}
      - NODE_ENV=production
    depends_on:
      - auth-service
      - cart-service
      - postgres
    networks:
      - market-ai-network

  storage-service:
    build: ./services/storage-service
    container_name: market-ai-storage
    restart: always
    ports:
      - "4005:4005"
    environment:
      - STORAGE_SERVICE_PORT=4005
      - S3_ENDPOINT=http://minio:9000
      - S3_PUBLIC_ENDPOINT=https://marketai-storage.helliong.space
      - S3_REGION=${S3_REGION:-us-east-1}
      - S3_BUCKET=${S3_BUCKET:-market-ai-products}
      - S3_ACCESS_KEY=${S3_ACCESS_KEY:-minioadmin}
      - S3_SECRET_KEY=${S3_SECRET_KEY:-minioadmin}
      - ADMIN_CLIENT_URL=${ADMIN_CLIENT_URL}
      - CLIENT_URL=${CLIENT_URL}
      - NODE_ENV=production
    depends_on:
      - minio
    networks:
      - market-ai-network

  ai-agent-service:
    build: ./services/ai-agent-service
    container_name: market-ai-agent
    restart: always
    ports:
      - "4006:4006"
    environment:
      - AI_AGENT_PORT=4006
      - DATABASE_URL=postgresql://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB}?schema=public
      - REDIS_URL=${REDIS_URL:-redis://redis:6379}
      - CATALOG_SERVICE_URL=http://catalog-service:4003
      - GIGACHAT_AUTH_KEY=${GIGACHAT_AUTH_KEY}
      - GIGACHAT_SCOPE=${GIGACHAT_SCOPE:-GIGACHAT_API_PERS}
      - GIGACHAT_MODEL=${GIGACHAT_MODEL:-GigaChat-2}
      - GIGACHAT_TLS_REJECT_UNAUTHORIZED=${GIGACHAT_TLS_REJECT_UNAUTHORIZED:-true}
      - NODE_ENV=production
      - CLIENT_URL=${CLIENT_URL}
    depends_on:
      - catalog-service
    networks:
      - market-ai-network

  client:
    build:
      context: ./apps/client
      args:
        NEXT_PUBLIC_API_GATEWAY_URL: ${NEXT_PUBLIC_API_GATEWAY_URL}
        NEXT_PUBLIC_AUTH_API_URL: ${NEXT_PUBLIC_AUTH_API_URL}
        NEXT_PUBLIC_SHOPPING_API_URL: ${NEXT_PUBLIC_SHOPPING_API_URL}
        NEXT_PUBLIC_CATALOG_API_URL: ${NEXT_PUBLIC_CATALOG_API_URL}
        NEXT_PUBLIC_STORAGE_PUBLIC_URL: ${NEXT_PUBLIC_STORAGE_PUBLIC_URL:-https://marketai-storage.helliong.space}
        NEXT_PUBLIC_ADMIN_URL: ${ADMIN_CLIENT_URL}
    container_name: market-ai-client
    restart: always
    environment:
      - NEXT_PUBLIC_API_GATEWAY_URL=${NEXT_PUBLIC_API_GATEWAY_URL}
      - NEXT_PUBLIC_AUTH_API_URL=${NEXT_PUBLIC_AUTH_API_URL}
      - NEXT_PUBLIC_SHOPPING_API_URL=${NEXT_PUBLIC_SHOPPING_API_URL}
      - NEXT_PUBLIC_CATALOG_API_URL=${NEXT_PUBLIC_CATALOG_API_URL}
      - NEXT_PUBLIC_STORAGE_PUBLIC_URL=${NEXT_PUBLIC_STORAGE_PUBLIC_URL:-https://marketai-storage.helliong.space}
      - NEXT_PUBLIC_ADMIN_URL=${ADMIN_CLIENT_URL}
    depends_on:
      - api-gateway
    networks:
      - market-ai-network

  admin:
    build:
      context: ./apps/admin
      args:
        VITE_AUTH_API_URL: ${NEXT_PUBLIC_AUTH_API_URL}
        VITE_CATALOG_API_URL: ${NEXT_PUBLIC_CATALOG_API_URL}
        VITE_ORDER_API_URL: ${NEXT_PUBLIC_API_GATEWAY_URL}/api/order
        VITE_STORAGE_API_URL: ${VITE_STORAGE_API_URL}
    container_name: market-ai-admin
    restart: always
    networks:
      - market-ai-network

  moderation:
    build:
      context: ./apps/moderation
      args:
        VITE_AUTH_API_URL: ${NEXT_PUBLIC_AUTH_API_URL}
    container_name: market-ai-moderation
    restart: always
    networks:
      - market-ai-network

volumes:
  postgres_data:
  minio_data:
  caddy_data:
  caddy_config:

networks:
  market-ai-network:
    driver: bridge
