services:
  postgres:
    image: postgres:16
    container_name: market-ai-postgres
    restart: always
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    ports:
      - "5433:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    networks:
      - market-ai-network

  redis:
    image: redis:7
    container_name: market-ai-redis
    restart: always
    ports:
      - "6379:6379"
    networks:
      - market-ai-network

  auth-service:
    build: ./services/auth-service
    container_name: market-ai-auth
    restart: always
    ports:
      - "4001:4001"
    environment:
      - DATABASE_URL=postgresql://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB}?schema=public
      - JWT_ACCESS_SECRET=${JWT_ACCESS_SECRET}
      - JWT_REFRESH_SECRET=${JWT_REFRESH_SECRET}
      - EMAIL_USER=${EMAIL_USER}
      - EMAIL_PASS=${EMAIL_PASS}
      - PORT=4001
      - NODE_ENV=production
    depends_on:
      - postgres
      - redis
    networks:
      - market-ai-network

  cart-service:
    build: ./services/cart-service
    container_name: market-ai-cart
    restart: always
    ports:
      - "4002:4002"
    environment:
      - DATABASE_URL=postgresql://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB}?schema=public
      - JWT_ACCESS_SECRET=${JWT_ACCESS_SECRET}
      - CLIENT_URL=${CLIENT_URL}
      - CART_SERVICE_PORT=4002
      - NODE_ENV=production
    depends_on:
      - postgres
      - auth-service
    networks:
      - market-ai-network

  catalog-service:
    build: ./services/catalog-service
    container_name: market-ai-catalog
    restart: always
    ports:
      - "4003:4003"
    environment:
      - DATABASE_URL=postgresql://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB}?schema=public
      - JWT_ACCESS_SECRET=${JWT_ACCESS_SECRET}
      - AUTH_SERVICE_URL=http://auth-service:4001
      - CATALOG_SERVICE_PORT=4003
      - ADMIN_CLIENT_URL=${ADMIN_CLIENT_URL}
      - CLIENT_URL=${CLIENT_URL}
      - NODE_ENV=production
    depends_on:
      - postgres
      - auth-service
    networks:
      - market-ai-network

  order-service:
    build: ./services/order-service
    container_name: market-ai-order
    restart: always
    ports:
      - "4004:4004"
    environment:
      - CLIENT_URL=${CLIENT_URL}
      - ORDER_SERVICE_PORT=4004
      - YOOKASSA_SHOP_ID=${YOOKASSA_SHOP_ID}
      - YOOKASSA_API_KEY=${YOOKASSA_API_KEY}
      - NODE_ENV=production
    depends_on:
      - auth-service
      - cart-service
    networks:
      - market-ai-network

volumes:
  postgres_data:

networks:
  market-ai-network:
    driver: bridge
